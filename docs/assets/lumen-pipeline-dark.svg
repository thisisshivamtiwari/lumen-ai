<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title"><title id="title">Lumen pipeline: tables, payments, features, models, ranked scores</title><rect width="1200" height="260" rx="24" fill="#101323"/><text x="32" y="39" fill="#a9b4d0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">FROM PAYMENT ACTIVITY TO A REVIEW QUEUE</text><rect x="28" y="65" width="204" height="131" rx="14" fill="#191e35" stroke="#363e60"/><text x="44" y="94" fill="#8b7bf6" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">01</text><text x="44" y="132" fill="#f1f5ff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Organiser tables</text><text x="44" y="163" fill="#a9b4d0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400">Transactions + transfers</text><path d="M239 130 h16 m-5 -5 5 5 -5 5" fill="none" stroke="#a9b4d0" stroke-width="2"/><rect x="263" y="65" width="204" height="131" rx="14" fill="#191e35" stroke="#363e60"/><text x="279" y="94" fill="#8b7bf6" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">02</text><text x="279" y="132" fill="#f1f5ff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Economic payments</text><text x="279" y="163" fill="#a9b4d0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400">One edge per transaction</text><path d="M474 130 h16 m-5 -5 5 5 -5 5" fill="none" stroke="#a9b4d0" stroke-width="2"/><rect x="498" y="65" width="204" height="131" rx="14" fill="#191e35" stroke="#363e60"/><text x="514" y="94" fill="#8b7bf6" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">03</text><text x="514" y="132" fill="#f1f5ff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Behaviour + graph</text><text x="514" y="163" fill="#a9b4d0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400">Wallets, bursts and paths</text><path d="M709 130 h16 m-5 -5 5 5 -5 5" fill="none" stroke="#a9b4d0" stroke-width="2"/><rect x="733" y="65" width="204" height="131" rx="14" fill="#191e35" stroke="#363e60"/><text x="749" y="94" fill="#8b7bf6" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">04</text><text x="749" y="132" fill="#f1f5ff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Models + context</text><text x="749" y="163" fill="#a9b4d0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400">CatBoost and neighbours</text><path d="M944 130 h16 m-5 -5 5 5 -5 5" fill="none" stroke="#a9b4d0" stroke-width="2"/><rect x="968" y="65" width="204" height="131" rx="14" fill="#191e35" stroke="#363e60"/><text x="984" y="94" fill="#8b7bf6" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">05</text><text x="984" y="132" fill="#f1f5ff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Ranked scores</text><text x="984" y="163" fill="#a9b4d0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400">One score per payment</text><text x="32" y="231" fill="#a9b4d0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400">Illustrative architecture. No labels, transaction values or performance measurements are drawn here.</text></svg>
